name: build-test-apk

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      # Test signing key: generated on first run and kept by the Actions cache.
      # If the cache is evicted, a new key is generated; uninstall the old APK first.
      - name: Cache test signing key
        uses: actions/cache@v4
        with:
          path: build/debug.keystore
          key: qpolllab-test-keystore-v1

      - name: Build test APK
        run: python3 build.py

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: QPollLab-test-${{ github.run_number }}
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
